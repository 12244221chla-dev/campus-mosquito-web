databases:
  - name: campus-mosquito-demo-db
    plan: free
    databaseName: campus_mosquito_demo
    user: campus_mosquito_demo
    region: singapore

services:
  - type: web
    name: campus-mosquito-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: campus-mosquito-demo-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: 12244221chl
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
